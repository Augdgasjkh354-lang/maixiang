<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#385443">
  <meta name="description" content="一座以粮食为本的古代小镇模拟经营游戏。">
  <title>麦乡 · 小镇岁时</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #302f24;
      --muted: #716f5f;
      --green: #355a43;
      --green-dark: #244336;
      --leaf: #728d5d;
      --gold: #d29c3d;
      --paper: #f5f1e5;
      --card: #fffdf7;
      --line: #ded7c4;
      --red: #9e4b39;
      --shadow: 0 8px 22px #34402b12;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: radial-gradient(ellipse at 50% -15%, #fffdf4 0, var(--paper) 58%); color: var(--ink); }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1540px, 100%); margin: 0 auto; padding: 18px clamp(12px, 2vw, 30px) 22px; }
    .topbar { display: grid; grid-template-columns: minmax(150px, 1fr) auto minmax(300px, 1fr); gap: 18px; align-items: center; }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark { display: grid; place-items: center; width: 48px; height: 48px; flex: 0 0 48px; border-radius: 15px 15px 13px 13px; color: #fff6d5; background: linear-gradient(145deg, #647e50, #35573e 70%); box-shadow: 0 4px 0 #263d31; font-size: 25px; }
    .brand h1 { margin: 0; color: var(--green-dark); font: 700 28px/1.1 "Noto Serif SC", "Songti SC", serif; letter-spacing: .08em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .clock { text-align: center; min-width: 190px; }
    .clock strong { display: block; font: 700 21px/1.35 "Noto Serif SC", "Songti SC", serif; letter-spacing: .04em; }
    .clock span { display: inline-block; margin-top: 3px; padding: 3px 10px; border-radius: 99px; color: var(--green); background: #e4ead9; font-size: 13px; }
    .time-controls { display: flex; justify-content: flex-end; align-items: center; gap: 7px; }
    .time-controls button { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px; color: var(--green-dark); background: var(--card); font-size: 13px; font-weight: 700; cursor: pointer; transition: .18s ease; }
    .time-controls button:hover { border-color: #879872; transform: translateY(-1px); }
    .time-controls button.selected { border-color: var(--green); color: white; background: var(--green); box-shadow: inset 0 -2px #203d2d; }
    .time-controls .reset { color: var(--red); }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0 14px; }
    .stat { min-height: 73px; padding: 11px 15px 10px; border: 1px solid var(--line); border-radius: 14px; background: #fffdf7d9; box-shadow: 0 3px 12px #463d2610; }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stat-label { color: var(--muted); font-size: 13px; }
    .stat-icon { font-size: 17px; opacity: .8; }
    .stat-value { margin-top: 2px; color: var(--green-dark); font: 700 20px/1.35 "Noto Serif SC", "Songti SC", serif; white-space: nowrap; }
    .stat-value small { color: var(--muted); font: 500 12px/1 system-ui,sans-serif; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(330px, .92fr); gap: 15px; align-items: stretch; }
    .map-card, .management { border: 1px solid #d9d0bb; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
    .map-heading { min-height: 48px; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #faf7ed; border-bottom: 1px solid var(--line); }
    .map-heading h2 { margin: 0; font: 700 17px/1.2 "Noto Serif SC", "Songti SC", serif; color: var(--green-dark); }
    .map-heading .land-note { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .map-wrap { position: relative; aspect-ratio: 3 / 2; min-height: 310px; overflow: hidden; background: #829360; isolation: isolate; }
    .map-art { position: absolute; inset: 0; background-image: url("./maixiang-village.png"); background-size: cover; background-position: center; }
    .field-tint { position: absolute; inset: 0 auto auto 0; width: 47%; height: 68%; pointer-events: none; mix-blend-mode: multiply; opacity: .16; transition: background .8s ease; background: #96d17b; clip-path: ellipse(75% 72% at 16% 25%); }
    .map-wrap[data-season="summer"] .field-tint { background: #f9d44f; opacity: .12; }
    .map-wrap[data-season="autumn"] .field-tint { background: #ce7e25; opacity: .17; }
    .map-wrap[data-season="winter"] .field-tint { background: #9ab8bc; opacity: .26; }
    .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, #16241800 67%, #16241840 100%); }
    .map-compass { position: absolute; z-index: 2; right: 13px; top: 12px; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #ffffff9c; border-radius: 50%; color: #fffde7; background: #4055448a; font: 600 12px serif; text-shadow: 0 1px 3px #333; }
    .map-marker { position: absolute; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 2px; transform: translate(-50%, -50%); padding: 0; border: 0; background: transparent; cursor: pointer; filter: drop-shadow(0 2px 2px #17271973); transition: transform .16s ease; }
    .map-marker:hover, .map-marker:focus-visible { z-index: 7; transform: translate(-50%, -56%) scale(1.07); outline: none; }
    .marker-icon { display: grid; place-items: center; width: 46px; height: 39px; border: 2px solid #fff5d4; border-radius: 14px 14px 10px 10px; color: #fff9e9; background: #365740e8; font-size: 22px; box-shadow: 0 3px 0 #23382c; }
    .marker-label { padding: 3px 7px; border-radius: 8px; color: #fffdf0; background: #28372dcc; font-size: 12px; white-space: nowrap; }
    .marker-label em { margin-left: 4px; color: #f8d77c; font-style: normal; }
    .map-marker.field .marker-icon { background: #927031ed; }
    .map-marker.houses .marker-icon { background: #735247ed; }
    .map-marker.well .marker-icon { background: #477379ec; }
    .map-marker.building .marker-icon { border-color: #ffeab2; background: #526c46f2; }
    .map-marker.project .marker-icon { background: #966e32ed; animation: worksite 1.5s ease-in-out infinite; }
    .plot-button { position: absolute; z-index: 3; transform: translate(-50%, -50%); padding: 5px 8px; border: 1px dashed #fff5c5; border-radius: 10px; color: #fffbe7; background: #495b3591; font-size: 12px; white-space: nowrap; cursor: pointer; text-shadow: 0 1px 2px #293222; transition: .18s ease; }
    .plot-button:hover, .plot-button:focus-visible, .plot-button.active { border-style: solid; background: #355941ec; outline: 2px solid #fff8cf; outline-offset: 1px; transform: translate(-50%, -53%) scale(1.04); }
    .plot-button.locked { opacity: .6; }
    .walker { position: absolute; z-index: 2; width: 11px; height: 17px; border: 2px solid #efe3bc; border-radius: 7px 7px 4px 4px; background: #577695; box-shadow: 0 2px 2px #2834228c; pointer-events: none; animation: stroll-a 18s ease-in-out infinite; }
    .walker::before { content: ""; position: absolute; left: 2px; top: -6px; width: 7px; height: 7px; border-radius: 50%; background: #d3aa78; }
    .walker.w2 { left: 58%; top: 48%; background: #8d5947; animation: stroll-b 22s ease-in-out -4s infinite; }
    .walker.w3 { left: 70%; top: 67%; background: #5d7745; animation: stroll-c 19s ease-in-out -8s infinite; }
    .walker.w1 { left: 57%; top: 64%; }
    @keyframes stroll-a { 0%,100%{transform:translate(0,0)} 26%{transform:translate(68px,-27px)} 54%{transform:translate(127px,10px)} 78%{transform:translate(48px,26px)} }
    @keyframes stroll-b { 0%,100%{transform:translate(0,0)} 32%{transform:translate(45px,35px)} 63%{transform:translate(114px,14px)} 82%{transform:translate(60px,-18px)} }
    @keyframes stroll-c { 0%,100%{transform:translate(0,0)} 35%{transform:translate(-58px,-25px)} 67%{transform:translate(-111px,-8px)} 86%{transform:translate(-55px,20px)} }
    @keyframes worksite { 0%,100%{box-shadow:0 3px 0 #68451e} 50%{box-shadow:0 3px 0 #68451e,0 0 15px #ffd76d} }
    .field-sign { position: absolute; z-index: 2; left: 14px; bottom: 12px; max-width: calc(100% - 28px); padding: 6px 10px; border: 1px solid #fff2c88a; border-radius: 10px; color: #fff8de; background: #27392acc; font-size: 13px; box-shadow: 0 2px 8px #1116; }
    .field-sign b { color: #f4d477; font-weight: 700; }
    .map-hint { position: absolute; z-index: 2; right: 12px; bottom: 12px; padding: 6px 9px; border-radius: 9px; color: #fffbea; background: #243629b8; font-size: 12px; }
    .map-footer { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
    .map-footer strong { color: var(--green-dark); font-weight: 700; }
    .management { display: flex; flex-direction: column; min-height: 100%; }
    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 8px 8px 0; background: #faf7ed; border-bottom: 1px solid var(--line); }
    .tab { min-height: 39px; padding: 6px 4px 8px; border: 0; border-radius: 9px 9px 0 0; color: var(--muted); background: transparent; font-size: 13px; cursor: pointer; }
    .tab:hover { color: var(--green); background: #eeeedf; }
    .tab.active { color: var(--green-dark); background: var(--card); box-shadow: 0 -2px var(--gold) inset; font-weight: 700; }
    .panel { padding: 14px; flex: 1; min-height: 440px; max-height: 560px; overflow-y: auto; scrollbar-color: #c3b99f transparent; scrollbar-width: thin; }
    .panel h2 { margin: 0 0 11px; color: var(--green-dark); font: 700 20px/1.25 "Noto Serif SC", "Songti SC", serif; }
    .panel h3 { margin: 17px 0 8px; color: #574f3e; font-size: 14px; }
    .intro { margin: 0 0 13px; padding: 11px 12px; border: 1px solid #ded4b6; border-left: 3px solid var(--gold); border-radius: 11px; background: #f9f4e7; font-size: 13px; line-height: 1.65; }
    .intro b { color: var(--green-dark); }
    .cardlet { padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fffefa; }
    .cardlet + .cardlet { margin-top: 9px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 9px; }
    .row + .row { margin-top: 7px; }
    .label { color: var(--muted); font-size: 13px; }
    .value { color: var(--green-dark); font-size: 14px; font-weight: 700; text-align: right; }
    .value.large { font: 700 18px "Noto Serif SC", "Songti SC", serif; }
    .subtle { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .meter { height: 9px; margin-top: 8px; border-radius: 99px; overflow: hidden; background: #e6e2d5; }
    .meter span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6d9155, #c1a047); transition: width .3s; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--green-dark); font-size: 14px; cursor: pointer; }
    .toggle input { width: 18px; height: 18px; accent-color: var(--green); }
    .job-row { display: grid; grid-template-columns: minmax(100px, 1fr) 38px 54px 38px; gap: 7px; align-items: center; padding: 9px 0; border-bottom: 1px solid #eee9db; }
    .job-row:last-child { border-bottom: 0; }
    .job-name { font-weight: 700; font-size: 14px; }
    .job-note { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .step-btn { height: 35px; border: 1px solid var(--line); border-radius: 9px; background: #fbf9f1; color: var(--green); cursor: pointer; font-size: 20px; line-height: 1; }
    .step-btn:disabled { opacity: .38; cursor: not-allowed; }
    .job-row input { width: 100%; height: 35px; border: 1px solid var(--line); border-radius: 8px; background: white; text-align: center; color: var(--ink); font-weight: 700; }
    .building-option { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fffefa; }
    .building-option + .building-option { margin-top: 9px; }
    .building-title { display: flex; gap: 9px; align-items: center; }
    .building-emoji { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 11px; background: #eef0e3; font-size: 20px; }
    .building-title b { font-size: 15px; }
    .building-title small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .primary, .secondary { min-height: 38px; padding: 8px 12px; border: 1px solid var(--green); border-radius: 10px; color: white; background: var(--green); font-weight: 700; font-size: 13px; cursor: pointer; transition: .15s; }
    .primary:hover { background: var(--green-dark); }
    .secondary { border-color: var(--line); color: var(--green-dark); background: #f8f5e9; }
    .primary:disabled, .secondary:disabled { opacity: .45; cursor: not-allowed; }
    .ledger-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .ledger-table th, .ledger-table td { padding: 7px 5px; border-bottom: 1px solid #eee9db; text-align: left; vertical-align: top; }
    .ledger-table th { color: var(--muted); font-weight: 600; }
    .ledger-table td.amount { white-space: nowrap; text-align: right; color: var(--green-dark); font-weight: 700; }
    .ledger-list { max-height: 215px; overflow-y: auto; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 7px; color: #4b6942; background: #e7eddc; font-size: 11px; white-space: nowrap; }
    .badge.red { color: #92513b; background: #f5e4d7; }
    .age-bars { display: grid; grid-template-columns: 1fr; gap: 9px; }
    .age-line { display: grid; grid-template-columns: 67px 1fr 62px; gap: 8px; align-items: center; font-size: 13px; }
    .age-line .meter { margin: 0; height: 10px; }
    .age-line strong { text-align: right; color: var(--green-dark); }
    .site-back { margin-bottom: 10px; border: 0; padding: 4px 0; color: var(--green); background: transparent; font-size: 13px; cursor: pointer; }
    .events { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; margin-top: 13px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 14px; background: #fffdf7; }
    .events-title { padding-top: 1px; color: var(--green-dark); font: 700 14px "Noto Serif SC", "Songti SC", serif; white-space: nowrap; }
    .event-list { display: grid; gap: 5px; }
    .event { color: #5e5b4d; font-size: 12px; line-height: 1.45; }
    .event time { margin-right: 7px; color: #989078; }
    .footer-note { margin-top: 11px; color: #827d6c; text-align: center; font-size: 12px; line-height: 1.5; }
    .toast { position: fixed; z-index: 20; left: 50%; bottom: 24px; max-width: min(500px, calc(100vw - 28px)); transform: translate(-50%, 15px); padding: 10px 14px; border: 1px solid #d7c99f; border-radius: 11px; color: #fff9e5; background: #344f3deF; box-shadow: 0 8px 26px #18251f38; opacity: 0; pointer-events: none; transition: .2s ease; font-size: 14px; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .shortage-banner { display: none; margin-bottom: 10px; padding: 9px 11px; border: 1px solid #d28a6b; border-radius: 10px; color: #793d2c; background: #fff0e6; font-size: 13px; }
    .shortage-banner.visible { display: block; }
    @media (max-width: 1050px) {
      .topbar { grid-template-columns: minmax(140px, 1fr) auto; }
      .time-controls { grid-column: 1 / -1; justify-content: center; }
      .workspace { grid-template-columns: minmax(0, 1.35fr) minmax(310px, .9fr); }
      .summary { margin-top: 12px; }
    }
    @media (max-width: 820px) {
      .shell { padding-top: 11px; }
      .workspace { grid-template-columns: 1fr; }
      .map-wrap { min-height: 0; }
      .management { min-height: auto; }
      .panel { max-height: none; min-height: 340px; }
      .summary { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
      .stat { min-height: 69px; padding: 9px 10px; }
      .stat-value { font-size: 18px; }
    }
    @media (max-width: 560px) {
      .shell { padding: 9px 9px 18px; }
      .topbar { grid-template-columns: 1fr auto; gap: 8px; }
      .brand-mark { width: 40px; height: 40px; flex-basis: 40px; font-size: 21px; }
      .brand h1 { font-size: 23px; }
      .brand p { font-size: 12px; }
      .clock { min-width: 123px; }
      .clock strong { font-size: 16px; }
      .clock span { font-size: 12px; }
      .time-controls { gap: 5px; }
      .time-controls button { min-height: 36px; padding: 0 8px; font-size: 12px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 10px 0; }
      .stat { min-height: 64px; }
      .stat-label { font-size: 12px; }
      .stat-value { font-size: 17px; }
      .map-card, .management { border-radius: 14px; }
      .map-heading { min-height: 42px; padding: 8px 11px; }
      .map-heading h2 { font-size: 15px; }
      .map-heading .land-note { font-size: 12px; }
      .map-wrap { aspect-ratio: 1.17; }
      .map-art { background-size: 100% 100%; background-position: center; }
      .marker-icon { width: 37px; height: 33px; font-size: 19px; }
      .marker-label { font-size: 11px; padding: 2px 5px; }
      .plot-button { padding: 4px 5px; font-size: 11px; }
      .field-sign { left: 8px; bottom: 8px; font-size: 12px; }
      .map-hint { right: 7px; bottom: 8px; font-size: 11px; }
      .map-footer { padding: 8px 10px; font-size: 12px; }
      .tabs { padding: 6px 5px 0; }
      .tab { font-size: 12px; min-height: 37px; }
      .panel { padding: 12px 11px; min-height: 330px; }
      .events { gap: 8px; padding: 9px; }
      .events-title { font-size: 13px; }
      .event { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">🌾</div><div><h1>麦乡</h1><p>一镇一岁，日子慢慢过</p></div></div>
      <div class="clock" aria-live="polite"><strong id="dateLabel">第1年 · 春 · 第1天</strong><span id="timeLabel">时光暂停</span></div>
      <div class="time-controls" role="group" aria-label="时间速度">
        <button id="pauseBtn" class="selected" aria-pressed="true">Ⅱ 暂停</button>
        <button data-speed="1" aria-pressed="false">▷ 1×</button>
        <button data-speed="4" aria-pressed="false">▷ 4×</button>
        <button data-speed="16" aria-pressed="false">▷ 16×</button>
        <button id="resetBtn" class="reset">重新开始</button>
      </div>
    </header>

    <section class="summary" aria-label="小镇概况">
      <div class="stat"><div class="stat-top"><span class="stat-label">镇上人口</span><span class="stat-icon">👥</span></div><div class="stat-value" id="populationStat">1,000 <small>人</small></div></div>
      <div class="stat"><div class="stat-top"><span class="stat-label">待业劳力</span><span class="stat-icon">🧺</span></div><div class="stat-value" id="idleStat">200 <small>人</small></div></div>
      <div class="stat"><div class="stat-top"><span class="stat-label">居民口粮</span><span class="stat-icon">🥣</span></div><div class="stat-value" id="residentStat">73万 <small>口粮斤</small></div></div>
      <div class="stat"><div class="stat-top"><span class="stat-label">镇库储备</span><span class="stat-icon">🏺</span></div><div class="stat-value" id="townStat">73万 <small>口粮斤</small></div></div>
    </section>

    <section class="workspace" aria-label="小镇经营">
      <section class="map-card" aria-label="小镇地图">
        <div class="map-heading"><h2>麦乡镇图</h2><span class="land-note">镇有麦田 4,000 亩 · 住宅可居 1,000 人</span></div>
        <div class="map-wrap" id="map" data-season="spring" role="region" aria-label="可交互的麦乡地图">
          <div class="map-art" aria-hidden="true"></div><div class="field-tint" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
          <div class="map-compass" aria-hidden="true">北</div>
          <div id="markers"></div>
          <span class="walker w1" aria-hidden="true"></span><span class="walker w2" aria-hidden="true"></span><span class="walker w3" aria-hidden="true"></span>
          <div class="field-sign" id="fieldSign">🌱 <b>春耕</b> · <span>麦苗返青</span></div>
          <div class="map-hint" id="mapHint">点田地、村舍或粮仓查看</div>
        </div>
        <div class="map-footer"><span>🌱 年收成预估 <strong id="forecastMap">1,600,000 斤</strong></span><span>居民口粮可维持 <strong id="daysMap">365 天</strong></span></div>
      </section>

      <section class="management" aria-label="镇务面板">
        <nav class="tabs" aria-label="镇务分类">
          <button class="tab active" data-tab="overview">镇务</button>
          <button class="tab" data-tab="jobs">就业</button>
          <button class="tab" data-tab="build">建设</button>
          <button class="tab" data-tab="people">人口</button>
          <button class="tab" data-tab="ledger">粮账</button>
        </nav>
        <div class="panel" id="panel" aria-live="polite"></div>
      </section>
    </section>

    <section class="events" aria-label="近来镇事"><div class="events-title">镇里近事</div><div class="event-list" id="events"></div></section>
    <p class="footer-note">口粮当量：小麦、面粉每斤计1口粮斤；面包每斤计5/6口粮斤。加工损耗会单独记账，工资与救济只转移账户，不减少全镇粮食。</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./engine.js"></script>
  <script>
    (() => {
      "use strict";
      const E = window.MaiEngine;
      const KEY = "maixiang-town-save-v1";
      const tabs = ["overview", "jobs", "build", "people", "ledger"];
      let state = null;
      let paused = true;
      let speed = 1;
      let activeTab = "overview";
      let selectedBuild = null;
      let selectedSite = null;
      let accumulator = 0;
      let toastTimer = 0;

      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.version === 1 && E.isValid(parsed)) state = parsed;
        }
      } catch (_) { state = null; }
      if (!state) state = E.createNewState();
      if (!Number.isFinite(state.satisfaction)) state.satisfaction = 75;

      const $ = id => document.getElementById(id);
      const number = n => Math.round(n || 0).toLocaleString("zh-CN");
      const compact = n => {
        const v = Math.round(n || 0);
        if (v >= 1000000) return `${(v / 1000000).toFixed(v % 1000000 === 0 ? 0 : 1)}百万`;
        if (v >= 10000) return `${(v / 10000).toFixed(v % 10000 === 0 ? 0 : 1)}万`;
        return number(v);
      };
      const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(state)); }
        catch (_) { showToast("本机存档空间不足，当前页面仍可继续游玩。"); }
      }
      function showToast(message) {
        const el = $("toast"); el.textContent = message; el.classList.add("show");
        clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
      }
      function stats() { return E.peopleStats(state); }
      function idleCount() { return stats().workers - E.employed(state); }
      function daysLeft() {
        const daily = Math.max(1, stats().total * E.CONFIG.foodPerPersonDay);
        return Math.floor(E.accountEq(state.stocks.residents) / daily);
      }
      function dayName(day) {
        const s = E.season(day);
        const index = day - s.start + 1;
        return { ...s, index };
      }
      function setPaused(value) {
        paused = value;
        if (paused) accumulator = 0;
        renderHeader();
      }

      function setTab(name) {
        activeTab = tabs.includes(name) || name === "site" ? name : "overview";
        selectedSite = name === "site" ? selectedSite : null;
        document.querySelectorAll(".tab").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === activeTab));
        renderPanel();
      }

      function renderHeader() {
        const pop = stats();
        const season = dayName(state.day);
        $("dateLabel").textContent = `第${state.year}年 · ${season.name} · 第${season.index}天`;
        $("timeLabel").textContent = paused ? "时光暂停" : `时光流转 · ${speed}×`;
        $("populationStat").innerHTML = `${number(pop.total)} <small>人</small>`;
        $("idleStat").innerHTML = `${number(idleCount())} <small>人</small>`;
        $("residentStat").innerHTML = `${compact(E.accountEq(state.stocks.residents))} <small>口粮斤</small>`;
        $("townStat").innerHTML = `${compact(E.accountEq(state.stocks.town))} <small>口粮斤</small>`;
        $("forecastMap").textContent = `${number(E.forecast(state))} 斤`;
        $("daysMap").textContent = `${number(daysLeft())} 天`;
        $("map").dataset.season = season.key;
        const seasonMark = { spring: "🌱 春耕", summer: "☀️ 夏管", autumn: "🌾 待收", winter: "🍂 冬闲" }[season.key];
        $("fieldSign").innerHTML = `${seasonMark} · <b>${esc(season.field)}</b>`;
        $("pauseBtn").classList.toggle("selected", paused);
        $("pauseBtn").setAttribute("aria-pressed", String(paused));
        document.querySelectorAll("[data-speed]").forEach(btn => {
          const selected = !paused && Number(btn.dataset.speed) === speed;
          btn.classList.toggle("selected", selected); btn.setAttribute("aria-pressed", String(selected));
        });
        $("mapHint").textContent = selectedBuild ? "请点地图上的一处空地选址" : "点田地、村舍或粮仓查看";
        $("mapHint").style.background = selectedBuild ? "#355941ed" : "#243629b8";
      }

      function renderMap() {
        const nodes = [];
        const put = (x, y, icon, label, kind, key, extra = "") => nodes.push(`<button class="map-marker ${kind}" style="left:${x}%;top:${y}%" data-site="${key}" aria-label="查看${esc(label)}"><span class="marker-icon">${icon}</span><span class="marker-label">${esc(label)}${extra}</span></button>`);
        put(18, 28, "🌾", "麦田", "field", "field", `<em>${number(E.CONFIG.acres)}亩</em>`);
        put(82, 23, "🏚️", "粮仓", "barn", "granary");
        put(66, 37, "🏠", "村舍", "houses", "houses");
        put(57, 50, "🪣", "古井", "well", "well");
        for (const plot of state.plots) {
          const building = state.buildings.find(b => b.plotId === plot.id);
          const project = state.project && state.project.plotId === plot.id ? state.project : null;
          if (building) {
            const isMill = building.type === "mill";
            const working = isMill ? state.jobs.millers > 0 : state.jobs.bakers > 0;
            const config = isMill ? E.CONFIG.mill : E.CONFIG.bakery;
            const staff = isMill ? state.jobs.millers : state.jobs.bakers;
            put(building.x, building.y, isMill ? "⚙️" : "🥖", isMill ? "磨坊" : "面包房", `building${working ? " working" : ""}`, building.type, `<em>${staff}/${config.slots}工</em>`);
          } else if (project) {
            const elapsed = Math.min(100, Math.floor(project.workDone / project.workRequired * 100));
            put(plot.x, plot.y, "🪚", "营造中", "project", "project", `<em>${elapsed}%</em>`);
          } else {
            const isChosen = selectedBuild !== null;
            nodes.push(`<button class="plot-button${isChosen ? " active" : ""}" style="left:${plot.x}%;top:${plot.y}%" data-plot="${plot.id}" aria-label="在${esc(plot.label)}建造">${isChosen ? "＋ 选此地" : `空地 · ${esc(plot.label)}`}</button>`);
          }
        }
        $("markers").innerHTML = nodes.join("");
      }

      function renderEvents() {
        const rows = state.events.slice(0, 3).map(e => `<div class="event"><time>第${e.year}年${e.day > 0 ? `·${e.day}日` : ""}</time>${esc(e.text)}</div>`);
        $("events").innerHTML = rows.length ? rows.join("") : `<div class="event">镇上平静，日子照常向前。</div>`;
      }

      function jobRow(role, title, note, cap) {
        const n = state.jobs[role];
        const allowed = Math.min(cap, n + idleCount());
        const disabled = cap <= 0;
        return `<div class="job-row"><div><div class="job-name">${title}</div><div class="job-note">${note}</div></div><button class="step-btn" data-role="${role}" data-step="-1" aria-label="减少${title}" ${n <= 0 ? "disabled" : ""}>−</button><input type="number" min="0" max="${allowed}" value="${n}" data-job="${role}" aria-label="${title}人数" ${disabled ? "disabled" : ""}><button class="step-btn" data-role="${role}" data-step="1" aria-label="增加${title}" ${n >= allowed ? "disabled" : ""}>＋</button></div>`;
      }

      function overviewPanel() {
        const pop = stats();
        const qeq = E.accountEq(state.stocks.residents);
        const forecast = E.forecast(state);
        const currentSeason = dayName(state.day);
        const progress = Math.min(100, Math.floor(state.cropWorkDays / E.CONFIG.growingDays * 100));
        const annualNeed = pop.total * E.CONFIG.foodPerPersonDay * E.CONFIG.daysPerYear;
        const shortage = state.shortage > 0;
        return `<h2>今日镇务</h2>
          <div class="shortage-banner${shortage ? " visible" : ""}">口粮短缺 ${number(state.shortage)} 斤，时光已暂停。可从镇库拨粮或启用自动救济。</div>
          <p class="intro"><b>新手上路</b>：现在时光暂停，先认认田、仓与村舍。选 <b>1×</b> 慢慢看镇上过日子；待业劳力可投进磨坊、面包房，建造时点空地选址。</p>
          <div class="cardlet">
            <div class="row"><span class="label">居民口粮能吃</span><strong class="value large">${number(daysLeft())} 天</strong></div>
            <div class="subtle">居民每日共需 ${number(pop.total * E.CONFIG.foodPerPersonDay)} 口粮斤；按当前人口全年约需 ${number(annualNeed)} 斤。</div>
            <label class="toggle" style="margin-top:11px"><input id="autoRelief" type="checkbox" ${state.autoRelief ? "checked" : ""}><span>自动救济：居民存粮低于七日时补到十四日</span></label>
            <div style="margin-top:10px"><button class="secondary" id="manualAid" ${E.accountEq(state.stocks.town) <= 0 ? "disabled" : ""}>手动拨粮 30,000斤</button></div>
            <div class="row" style="margin-top:11px"><span class="label">居民日子舒心</span><strong class="value">${Math.round(state.satisfaction)} / 100</strong></div>
            <div class="subtle">口粮有保障是底子；偶尔分到面包，日常滋味会更好。</div>
          </div>
          <div class="cardlet" style="margin-top:9px">
            <div class="row"><span class="label">${currentSeason.name} · ${currentSeason.field}</span><strong class="value">${number(state.jobs.farmers)} / ${E.CONFIG.acres / E.CONFIG.acresPerFarmer} 名农人</strong></div>
            <div class="meter" aria-label="全年耕作投入 ${progress}%"><span style="width:${progress}%"></span></div>
            <div class="row" style="margin-top:7px"><span class="label">按今年用工推算净收成</span><strong class="value">${number(forecast)} 斤</strong></div>
            <div class="subtle">秋收结算；满额完成274个春夏秋农事日，净收 ${number(E.CONFIG.acres * E.CONFIG.yieldPerAcre)} 斤，居民与镇库各分一半。调农人数只从调入之日起计入。</div>
          </div>
          <div class="cardlet" style="margin-top:9px">
            <div class="row"><span class="label">镇上劳力</span><strong class="value">${number(pop.workers)} 人</strong></div>
            <div class="row"><span class="label">已就业 / 待业</span><strong class="value">${number(E.employed(state))} / ${number(idleCount())} 人</strong></div>
            <div class="subtle">在“就业”里分配岗位。所有在业人口合计不超过劳动年龄人口。</div>
          </div>
          <h3>粮食周转提醒</h3>
          <div class="subtle">磨坊和面包房先使用镇库粮食，产物仍归镇库；工资、施工粮酬、救济均转入居民账。居民每天口粮只从居民账扣。</div>`;
      }

      function jobsPanel() {
        const pop = stats();
        const caps = {
          farmers: E.CONFIG.acres / E.CONFIG.acresPerFarmer,
          builders: state.project ? 24 : 0,
          millers: state.buildings.some(b => b.type === "mill") ? E.CONFIG.mill.slots : 0,
          bakers: state.buildings.some(b => b.type === "bakery") ? E.CONFIG.bakery.slots : 0
        };
        return `<h2>安排就业</h2>
          <div class="cardlet"><div class="row"><span class="label">劳动年龄人口</span><strong class="value">${number(pop.workers)} 人</strong></div><div class="row"><span class="label">已安排 / 待业</span><strong class="value">${number(E.employed(state))} / ${number(idleCount())}</strong></div><div class="subtle">一人只占一个岗位。离岗可点“−”；尚未建成的行业暂不能排班。</div></div>
          <h3>岗位分配</h3>
          ${jobRow("farmers", "务农", `最多${number(caps.farmers)}人 · 每人照看10亩`, caps.farmers)}
          ${jobRow("builders", "营造", state.project ? `工程施工 · ${number(state.project.workRequired - state.project.workDone)}工日尚需` : "开工后安排建筑工人", caps.builders)}
          ${jobRow("millers", "磨坊", caps.millers ? `每人每日最多磨${number(E.CONFIG.mill.wheatPerWorkerDay)}斤麦` : "需先建成磨坊", caps.millers)}
          ${jobRow("bakers", "面包房", caps.bakers ? `每人每日最多烤${number(E.CONFIG.bakery.flourPerWorkerDay)}斤面粉` : "需先建成面包房", caps.bakers)}
          <div class="cardlet" style="margin-top:10px"><div class="row"><span class="label">田里已耕时长</span><strong class="value">${state.cropWorkDays.toFixed(0)} / ${E.CONFIG.growingDays} 农人日</strong></div><div class="subtle">收麦只计春夏秋农事日；冬季田间休整。新调入农田的人手不会补算过去的耕作。</div></div>`;
      }

      function buildPanel() {
        const project = state.project;
        const buildings = new Set(state.buildings.map(b => b.type));
        const projectType = project && project.type;
        const mill = E.CONFIG.mill, bakery = E.CONFIG.bakery;
        const buildCard = (type, icon, title, desc, cfg) => {
          const done = buildings.has(type);
          const planned = projectType === type;
          const unavailable = done || planned || !!project;
          const remain = planned ? Math.max(0, project.workRequired - project.workDone) : cfg.workDays;
          const staff = planned ? state.jobs.builders : cfg.workers;
          const days = staff > 0 ? Math.ceil(remain / staff) : cfg.workDays;
          const cost = cfg.workDays * cfg.payPerWorkDay;
          return `<div class="building-option"><div class="row"><div class="building-title"><span class="building-emoji">${icon}</span><div><b>${title}</b><small>${done ? "已落成" : planned ? `营造中 · ${Math.floor(project.workDone / project.workRequired * 100)}%` : desc}</small></div></div>${done ? `<span class="badge">已建成</span>` : planned ? `<span class="badge">${project.workDone}/${project.workRequired}工日</span>` : `<span class="badge">${number(cost)}斤粮酬</span>`}</div>
            <div class="subtle">${title === "磨坊" ? `上限12人 · 每人每日磨80斤麦 · 工钱2斤/人日` : `上限10人 · 每人每日烤80斤面粉 · 工钱2.2斤/人日`}<br>${planned ? `剩余约${days}日（现有${number(state.jobs.builders)}名建筑工）` : `施工${cfg.workDays}工日；按${cfg.workers}人约${Math.ceil(cfg.workDays / cfg.workers)}日，施工粮酬已从镇库转给居民。`}</div>
            ${planned ? `<div class="meter"><span style="width:${Math.min(100, project.workDone / project.workRequired * 100)}%"></span></div><div class="subtle">${state.jobs.builders > 0 ? "工地照常施工。" : "缺人停工，请到就业里安排建筑工人。"}</div>` : done ? "" : `<button class="primary choose-build" data-build="${type}" style="margin-top:10px" ${unavailable || E.accountEq(state.stocks.town) < cost ? "disabled" : ""}>${unavailable ? "暂不能开工" : selectedBuild === type ? "已选好，请点地图空地" : "选择地块开工"}</button>`}
          </div>`;
        };
        const projectNotice = project ? `<div class="intro">当前工程：<b>${project.type === "mill" ? "磨坊" : "面包房"}</b>。地图上标有“营造中”的地块；建筑工人可在“就业”中调整。</div>` : "";
        return `<h2>兴建作坊</h2>
          <p class="intro">先用镇库粮食付施工粮酬，再由建筑工人投入施工时间。开工时粮酬即转给居民，工人日常口粮仍只记一次。</p>
          ${projectNotice}
          ${buildCard("mill", "⚙️", "磨坊", "小麦磨面 · 先建磨坊，再招磨坊工", mill)}
          ${buildCard("bakery", "🥖", "面包房", "面粉烤面包 · 需已有磨坊产面", bakery)}
          <h3>加工约定</h3>
          <div class="cardlet"><div class="subtle" style="margin-top:0">磨坊：100斤小麦 → 80斤面粉；余下20口粮斤作麸皮损耗，逐笔记账。<br>面包房：100斤面粉 → 120斤面包；加水只增重量，仍计100口粮斤。<br>原料和成品均属镇库。面包优先改善生活感受，不增加口粮财富。</div></div>`;
      }

      function peoplePanel() {
        const p = stats();
        const last = state.lastDemography;
        const sum = Math.max(1, p.total);
        const housing = Math.round(p.total / E.CONFIG.housing * 100);
        return `<h2>镇民年谱</h2>
          <div class="age-bars">
            <div class="age-line"><span>未成年人</span><div class="meter"><span style="width:${p.children / sum * 100}%"></span></div><strong>${number(p.children)} 人</strong></div>
            <div class="age-line"><span>劳动年龄</span><div class="meter"><span style="width:${p.workers / sum * 100}%;background:linear-gradient(90deg,#557d50,#73975b)"></span></div><strong>${number(p.workers)} 人</strong></div>
            <div class="age-line"><span>老人</span><div class="meter"><span style="width:${p.elders / sum * 100}%;background:linear-gradient(90deg,#ad8d51,#d0b66b)"></span></div><strong>${number(p.elders)} 人</strong></div>
          </div>
          <div class="cardlet" style="margin-top:13px"><div class="row"><span class="label">人口总数（不含镇长）</span><strong class="value">${number(p.total)} 人</strong></div><div class="row"><span class="label">住宅可居 / 当前人数</span><strong class="value">${number(E.CONFIG.housing)} / ${number(p.total)}</strong></div><div class="row"><span class="label">已婚夫妇</span><strong class="value">约${number(p.marriedCouples)} 对</strong></div><div class="row"><span class="label">居民日子舒心</span><strong class="value">${Math.round(state.satisfaction)} / 100</strong></div><div class="subtle">口粮保障和面包餐食会影响满意度；面包不计作额外财富。</div></div>
          <h3>上年人口变化</h3>
          <div class="cardlet"><div class="row"><span class="label">出生 / 死亡</span><strong class="value">${number(last.births)} / ${number(last.deaths)} 人</strong></div><div class="row"><span class="label">新结夫妇</span><strong class="value">${number(last.marriages)} 对</strong></div><div class="subtle">18岁进入劳动年龄，65岁退休。婚育随粮食保障、住宅余量温和变化；年末统一结算，不另加人口增长率。</div></div>
          <div class="cardlet" style="margin-top:9px"><div class="subtle" style="margin-top:0">年死亡率随年龄提高：18岁前约0.1–0.4%，劳动年龄约0.25%，65岁后逐段提高。满足口粮与居住时，适龄已婚女性生育率约31%/年，住房紧张或可用粮减少时会降低。</div></div>`;
      }

      function ledgerPanel() {
        const r = state.stocks.residents, t = state.stocks.town;
        const total = E.allEq(state);
        const rows = state.ledger.slice(0, 42).map(row => {
          const category = { harvest: "收获", consume: "消耗", relief: "救济", wage: "工资", construction: "建设", process: "加工", loss: "损耗", transfer: "转账" }[row.type] || "记账";
          const badgeClass = ["loss", "consume"].includes(row.type) ? "badge red" : "badge";
          return `<tr><td>第${row.year}年·${row.day}日</td><td><span class="${badgeClass}">${category}</span><br>${esc(row.reason)}<div class="subtle">${esc(row.detail || "")}</div></td><td class="amount">${number(row.amount)}斤</td></tr>`;
        }).join("");
        const y = state.yearTotals;
        const daily = Math.max(1, stats().total * E.CONFIG.foodPerPersonDay);
        return `<h2>粮食账目</h2>
          <div class="cardlet"><div class="row"><span class="label">居民账（口粮当量）</span><strong class="value">${number(E.accountEq(r))} 斤</strong></div><div class="subtle">小麦 ${number(r.wheat)}斤 · 面粉 ${number(r.flour)}斤 · 面包 ${number(r.bread)}斤</div><div class="row" style="margin-top:10px"><span class="label">镇库账（口粮当量）</span><strong class="value">${number(E.accountEq(t))} 斤</strong></div><div class="subtle">小麦 ${number(t.wheat)}斤 · 面粉 ${number(t.flour)}斤 · 面包 ${number(t.bread)}斤</div><div class="row" style="margin-top:9px;padding-top:8px;border-top:1px solid #eee9db"><span class="label">全镇可食口粮合计</span><strong class="value">${number(total)} 斤</strong></div><div class="subtle">居民每日消费${number(daily)}斤；口粮${number(daysLeft())}天。</div></div>
          <h3>本年收支（已过${state.day}天）</h3>
          <div class="cardlet"><div class="row"><span class="label">收成入库</span><strong class="value">${number(y.harvest)}斤</strong></div><div class="row"><span class="label">居民口粮消费</span><strong class="value">${number(y.consumption)}斤</strong></div><div class="row"><span class="label">工资 / 施工转付</span><strong class="value">${number(y.operatingWages + y.constructionPay)}斤</strong></div><div class="row"><span class="label">救济转付 / 加工损耗</span><strong class="value">${number(y.relief)} / ${number(y.processingLoss)}斤</strong></div><div class="subtle">工资、救济、施工报酬改变账户归属；只有吃饭与记录在案的加工损耗减少全镇口粮。</div></div>
          <h3>最近账目</h3>
          <div class="ledger-list"><table class="ledger-table"><thead><tr><th>日期</th><th>缘由</th><th style="text-align:right">数量</th></tr></thead><tbody>${rows || `<tr><td colspan="3">尚无账目。</td></tr>`}</tbody></table></div>`;
      }

      function sitePanel() {
        const site = selectedSite || "field";
        const p = stats();
        let title = "小镇一隅", content = "";
        if (site === "field") {
          title = "镇有麦田";
          const forecast = E.forecast(state);
          content = `<div class="row"><span class="label">耕地面积</span><strong class="value">${number(E.CONFIG.acres)} 亩</strong></div><div class="row"><span class="label">当前农人</span><strong class="value">${number(state.jobs.farmers)} 人</strong></div><div class="row"><span class="label">一人照看 / 总需</span><strong class="value">10 / ${number(E.CONFIG.acres / 10)} 人</strong></div><div class="row"><span class="label">今年预计净收</span><strong class="value">${number(forecast)} 斤</strong></div><div class="subtle">已扣种粮；满额全年160万斤。农田工作投入按实际农人日计算。</div>`;
        } else if (site === "granary") {
          title = "共用粮仓 · 分户记账";
          content = `<div class="row"><span class="label">居民账</span><strong class="value">${number(E.accountEq(state.stocks.residents))}口粮斤</strong></div><div class="row"><span class="label">镇库账</span><strong class="value">${number(E.accountEq(state.stocks.town))}口粮斤</strong></div><div class="row"><span class="label">口粮可吃</span><strong class="value">${number(daysLeft())}天</strong></div><div class="subtle">粮食统一储存，账面按所有者区分。点“粮账”查看每种粮食的重量和变化缘由。</div><button class="secondary" data-go="ledger" style="margin-top:10px">打开粮账</button>`;
        } else if (site === "houses") {
          title = "村舍与镇民";
          content = `<div class="row"><span class="label">住宅容量</span><strong class="value">${number(E.CONFIG.housing)} 人</strong></div><div class="row"><span class="label">住在镇上的人</span><strong class="value">${number(p.total)} 人</strong></div><div class="row"><span class="label">儿童 / 老人</span><strong class="value">${number(p.children)} / ${number(p.elders)} 人</strong></div><div class="subtle">18岁成年、65岁退老。镇长不计入人口。</div><button class="secondary" data-go="people" style="margin-top:10px">查看人口年谱</button>`;
        } else if (site === "well") {
          title = "古井与村道";
          content = `<div class="subtle" style="margin-top:0">村道从粮仓穿过民居，镇民每天沿路往来。路边空地可兴建作坊，建成后会在地图上出现忙碌的作坊标记。</div>`;
        } else if (site === "mill" || site === "bakery") {
          const isMill = site === "mill";
          const built = state.buildings.some(b => b.type === site);
          const employees = isMill ? state.jobs.millers : state.jobs.bakers;
          const cap = isMill ? E.CONFIG.mill.slots : E.CONFIG.bakery.slots;
          title = isMill ? "磨坊" : "面包房";
          const dailyCap = employees * (isMill ? E.CONFIG.mill.wheatPerWorkerDay : E.CONFIG.bakery.flourPerWorkerDay);
          const inputItem = isMill ? "小麦" : "面粉";
          const current = state.stocks.town[isMill ? "wheat" : "flour"];
          content = built ? `<div class="row"><span class="label">工人 / 岗位</span><strong class="value">${employees} / ${cap} 人</strong></div><div class="row"><span class="label">每日加工上限</span><strong class="value">${number(dailyCap)} 斤${inputItem}</strong></div><div class="row"><span class="label">镇库现有原料</span><strong class="value">${number(current)} 斤${inputItem}</strong></div><div class="row"><span class="label">当前状态</span><strong class="value">${employees === 0 ? "缺人停工" : current === 0 ? "缺料停工" : "可以开工"}</strong></div><div class="subtle">加工原料、产物均记在镇库。工资由镇库转给居民，不凭空减少全镇总粮。</div><button class="secondary" data-go="jobs" style="margin-top:10px">调整作坊用工</button>` : `<div class="subtle">尚未建成。可在“建设”选择地块开工。</div><button class="secondary" data-go="build" style="margin-top:10px">前往建设</button>`;
        } else if (site === "project") {
          const pr = state.project;
          title = "营造工地";
          content = pr ? `<div class="row"><span class="label">正在兴建</span><strong class="value">${pr.type === "mill" ? "磨坊" : "面包房"}</strong></div><div class="row"><span class="label">施工进度</span><strong class="value">${number(pr.workDone)} / ${number(pr.workRequired)} 工日</strong></div><div class="row"><span class="label">建筑工人</span><strong class="value">${number(state.jobs.builders)} 人</strong></div><div class="subtle">${state.jobs.builders ? `约${Math.ceil((pr.workRequired-pr.workDone)/state.jobs.builders)}日完工` : "缺人停工；到就业面板安排建筑工人。"}</div><button class="secondary" data-go="jobs" style="margin-top:10px">调整建筑工人</button>` : "目前没有在建工程。";
        }
        return `<button class="site-back" data-back>‹ 返回镇务</button><h2>${title}</h2><div class="cardlet">${content}</div>`;
      }

      function renderPanel() {
        const panel = $("panel");
        if (activeTab === "site") { panel.innerHTML = sitePanel(); return; }
        const view = { overview: overviewPanel, jobs: jobsPanel, build: buildPanel, people: peoplePanel, ledger: ledgerPanel }[activeTab] || overviewPanel;
        panel.innerHTML = view();
      }

      function render() {
        renderHeader(); renderMap(); renderEvents(); renderPanel(); save();
      }

      function refreshMapPanel() { renderHeader(); renderMap(); renderEvents(); renderPanel(); save(); }

      document.querySelectorAll("[data-speed]").forEach(button => button.addEventListener("click", () => {
        speed = Number(button.dataset.speed); setPaused(false); accumulator = 0;
      }));
      $("pauseBtn").addEventListener("click", () => setPaused(true));
      $("resetBtn").addEventListener("click", () => {
        if (!window.confirm("要重新开始《麦乡》吗？这会清除本机的当前存档。")) return;
        state = E.createNewState(); selectedBuild = null; selectedSite = null; activeTab = "overview"; speed = 1; setPaused(true); render(); showToast("新一年的镇务从今日开始。 ");
      });

      document.querySelectorAll(".tab").forEach(button => button.addEventListener("click", () => { selectedBuild = null; setTab(button.dataset.tab); renderMap(); }));
      $("panel").addEventListener("click", event => {
        const tab = event.target.closest("[data-go]");
        if (tab) { selectedBuild = null; setTab(tab.dataset.go); renderMap(); return; }
        if (event.target.matches("#autoRelief")) { state.autoRelief = event.target.checked; save(); showToast(state.autoRelief ? "自动救济已开启。" : "自动救济已关闭。"); return; }
        if (event.target.closest("#manualAid")) {
          const moved = E.manualRelief(state, 30000);
          refreshMapPanel(); showToast(moved.removedEq > 0 ? `已向居民账拨出 ${number(moved.removedEq)}斤口粮。` : "镇库已无可拨口粮。"); return;
        }
        const adjust = event.target.closest("[data-job][data-step]");
        if (adjust) {
          const role = adjust.dataset.job, step = Number(adjust.dataset.step);
          E.adjustJobs(state, role, state.jobs[role] + step); refreshMapPanel(); return;
        }
        const stepButton = event.target.closest(".step-btn[data-role]");
        if (stepButton) {
          const role = stepButton.dataset.role;
          E.adjustJobs(state, role, state.jobs[role] + Number(stepButton.dataset.step)); refreshMapPanel(); return;
        }
        const choose = event.target.closest(".choose-build");
        if (choose) { selectedBuild = choose.dataset.build; renderHeader(); renderMap(); showToast("请在地图上点一处空地选址。"); }
        if (event.target.closest("[data-back]")) { selectedSite = null; setTab("overview"); renderMap(); }
      });
      $("panel").addEventListener("change", event => {
        if (event.target.matches("[data-job]")) {
          E.adjustJobs(state, event.target.dataset.job, Number(event.target.value)); refreshMapPanel();
        }
        if (event.target.matches("#autoRelief")) { state.autoRelief = event.target.checked; save(); }
      });
      $("markers").addEventListener("click", event => {
        const plotButton = event.target.closest("[data-plot]");
        if (plotButton) {
          if (!selectedBuild) { showToast("先到“建设”选择磨坊或面包房，再选地块。"); return; }
          const result = E.startBuild(state, selectedBuild, plotButton.dataset.plot);
          if (!result.ok) { showToast(result.reason); return; }
          const name = selectedBuild === "mill" ? "磨坊" : "面包房";
          selectedBuild = null; activeTab = "build"; document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "build"));
          refreshMapPanel(); showToast(`${name}开工，已安排${result.assignedBuilders}名建筑工。`); return;
        }
        const marker = event.target.closest("[data-site]");
        if (marker) { selectedSite = marker.dataset.site; setTab("site"); }
      });

      setInterval(() => {
        if (paused) return;
        accumulator += 0.1 * E.CONFIG.speed.baseDaysPerSecond * speed;
        let changed = false;
        while (accumulator >= 1 && !paused) {
          accumulator -= 1;
          E.tickDay(state);
          changed = true;
          if (state.shortage > 0) { setPaused(true); showToast("口粮出现短缺，时光已暂停。"); }
        }
        if (changed) render();
      }, 100);

      render();
    })();
  </script>
</body>
</html>
